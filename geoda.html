<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geoda: rompe, mejora, desciende</title>
<style>
:root{color-scheme:dark;--bg:#0c0a18;--pn:#161230;--pn2:#241d4a;--tx:#f2eeff;--mu:#a49dd0;--ac:#7cf0d0;--gold:#ffd25e;--ln:#3a3270;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0a18}}
:root[data-theme="dark"]{--bg:#0c0a18}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{display:grid;grid-template-columns:1fr 340px;height:100%}
#stage{position:relative;min-width:0;min-height:0;touch-action:manipulation}
#cv{width:100%;height:100%;display:block;cursor:pointer;outline:none}
#hud{position:absolute;left:0;right:0;top:0;padding:12px 14px;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
#gems{font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.5px;text-shadow:0 2px 18px #7cf0d066}
#gems span{color:var(--ac)}
#sub{font-size:13px;color:var(--mu)}
#zone{text-align:right;font-size:14px;color:var(--mu)}#zone b{display:block;color:var(--tx);font-size:16px}
.btn{pointer-events:auto;background:var(--pn2);border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--ac)}.btn:focus-visible,.up:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#goal{position:absolute;left:14px;right:14px;bottom:12px;background:#161230cc;border:1px solid var(--ln);border-radius:12px;padding:8px 12px;font-size:13px;backdrop-filter:blur(4px)}
#goal .bar{height:7px;background:#0007;border-radius:9px;margin-top:6px;overflow:hidden}
#goal .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--gold));transition:width .25s}
#dyn{position:absolute;right:14px;bottom:78px;width:76px;height:76px;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(#4a2a10,#1c0f08);color:var(--tx);font-size:30px;cursor:pointer;display:none;overflow:hidden}
#dyn::after{content:"";position:absolute;inset:0;background:#000a;transform-origin:bottom;transform:scaleY(var(--p,0))}
#dyn small{position:absolute;bottom:4px;left:0;right:0;font-size:10px;z-index:1}
#dyn.rdy{box-shadow:0 0 22px #ffd25e99}
#toast{position:absolute;left:50%;top:84px;transform:translate(-50%,-10px);background:var(--pn2);border:1px solid var(--gold);padding:9px 16px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;text-align:center;max-width:90%;z-index:3}
#toast.on{opacity:1;transform:translate(-50%,0)}
#side{background:var(--pn);border-left:1px solid var(--ln);overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
#side h2{margin:0 0 2px;font-size:15px;color:var(--mu);font-weight:600}
.up{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--pn2);border:1px solid var(--ln);border-radius:12px;padding:10px;color:var(--tx);font:inherit;cursor:pointer;width:100%;transition:transform .12s,border-color .2s}
.up .ic{font-size:26px;text-align:center}.up b{font-size:14px}.up i{font-style:normal;font-size:12px;color:var(--gold);margin-left:6px}
.up small{display:block;color:var(--mu);font-size:12px;margin-top:2px}
.up .cost{font-weight:700;font-size:14px;color:var(--mu);white-space:nowrap}
.up.can{border-color:var(--ac)}.up.can .cost{color:var(--ac)}
.up.can{animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 14px #7cf0d044}}
.up.pop{transform:scale(.96)}
.up.lock{opacity:.5;cursor:default;animation:none}
#menu{position:absolute;inset:0;background:#07051299;display:none;align-items:center;justify-content:center;z-index:5;backdrop-filter:blur(3px)}
#menu.on{display:flex}
#menu .box{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:20px;width:min(340px,90%);display:flex;flex-direction:column;gap:12px}
#menu h1{margin:0;font-size:22px}
#menu label{display:flex;gap:10px;align-items:center;justify-content:space-between;color:var(--mu);font-size:14px}
#menu input[type=range]{flex:1}
.danger{border-color:#ff7a8a}
#side{background:linear-gradient(#17141f,#0f0d16);border-left:1px solid #3a3548;box-shadow:inset 6px 0 14px #0008}
.up{background:linear-gradient(#27232f,#1a1722);border-color:#3d3749;box-shadow:inset 0 1px #ffffff14,0 3px 8px #0007}
.up:hover{border-color:#8a8299}.up:active{transform:scale(.97)}.up.can{border-color:var(--ac)}.up.lock{filter:grayscale(.7)}
#goal,.btn{background:linear-gradient(#25212d,#16131d);border-color:#3d3749;box-shadow:inset 0 1px #ffffff14}
#gems{text-shadow:0 2px 14px #000,0 0 18px #7cf0d044}
@media (max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:54% 46%}#side{border-left:0;border-top:1px solid var(--ln)}#dyn{bottom:70px;width:62px;height:62px;font-size:24px}#toast{top:70px}}
@media (prefers-reduced-motion:reduce){.up.can{animation:none}*{transition:none!important}}
</style></head>
<body>
<div id="app">
<div id="stage">
<canvas id="cv" tabindex="0" aria-label="Geoda: toca o pulsa Enter para golpear"></canvas>
<div id="hud"><div><div id="gems"><span>◆</span> 0</div><div id="sub"></div></div>
<div style="display:flex;gap:10px;align-items:flex-start"><div id="zone"></div><button class="btn" id="pause" aria-label="Pausa y opciones">⏸</button></div></div>
<button id="dyn" aria-label="Dinamita">💥<small>ESPACIO</small></button>
<div id="goal"><div id="gt"></div><div class="bar"><i id="gb"></i></div></div>
<div id="toast"></div>
<div id="menu"><div class="box"><h1>Pausa</h1>
<label>Volumen <input type="range" id="vol" min="0" max="1" step=".05"></label>
<label>Sonido <button class="btn" id="mute"></button></label>
<button class="btn" id="resume">Seguir excavando</button>
<button class="btn danger" id="reset">Reiniciar partida</button>
<div style="font-size:12px;color:var(--mu)">El progreso se guarda solo en este navegador.</div></div></div>
</div>
<div id="side"><h2>Mejoras</h2><div id="ups"></div></div>
</div>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),cx=cv.getContext('2d');
let W=0,H=0;
function fit(){const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
new ResizeObserver(fit).observe(cv);
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches,KEY='geoda_v1';
const def=()=>({g:0,tot:0,geo:0,bought:0,up:{pick:0,drill:0,crit:0,mult:0,combo:0,dyn:0},goal:0,seen:{pick:1},vol:.5,mute:false});
let S=def();
try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.up){S=Object.assign(def(),d);S.up=Object.assign(def().up,d.up);S.seen=Object.assign({pick:1},d.seen)}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const fmt=n=>{if(n<1000)return n<10&&n%1?n.toFixed(1):Math.floor(n)+'';const s=['K','M','B','T'];let i=-1;while(n>=1000&&i<3){n/=1000;i++}return(n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n))+s[i]};
/* ---------- audio ---------- */
let ac;
function snd(f,d=.08,t='triangle',v=.2,sl=0,dl=0){if(S.mute||S.vol<=0)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const T=ac.currentTime+dl,o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.setValueAtTime(f,T);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),T+d);g.gain.setValueAtTime(v*S.vol,T);g.gain.exponentialRampToValueAtTime(.0001,T+d);o.connect(g);g.connect(ac.destination);o.start(T);o.stop(T+d)}catch(e){}}
const arp=(a,t='sine')=>a.forEach((f,i)=>snd(f,.16,t,.18,0,i*.08));
/* ---------- datos ---------- */
const ZN=['Cueva de cuarzo','Mina de amatista','Gruta esmeralda','Cámara de rubí','Corazón cósmico'],ZH=[190,275,145,350,45];
const zi=()=>Math.min(4,Math.floor(S.geo/8));
const U=[
{k:'pick',n:'Pico de cuarzo',ic:'⛏️',b:12,g:1.45,u:()=>1,d:l=>`Daño por golpe: ${1+l} → ${2+l}`,lk:''},
{k:'drill',n:'Taladro automático',ic:'⚙️',b:60,g:1.5,u:()=>S.tot>=30,d:l=>`Golpea solo: ${fmt(l*2)}/s → ${fmt(l*2+2)}/s`,lk:'Reúne 30 gemas'},
{k:'crit',n:'Ojo de joyero',ic:'🔍',b:150,g:1.7,u:()=>S.geo>=2,d:l=>`Punto brillante: x${3+l*.5} → x${3.5+l*.5} y más grande`,lk:'Rompe 2 geodas'},
{k:'combo',n:'Ritmo minero',ic:'🔥',b:400,g:1.8,u:()=>S.geo>=5,d:l=>`Golpes seguidos: +${l*3}% → +${l*3+3}% por golpe (máx. 30)`,lk:'Rompe 5 geodas'},
{k:'mult',n:'Veta enriquecida',ic:'💎',b:900,g:3.2,u:()=>S.geo>=8,d:l=>`Valor de cada gema: x${2**l} → x${2**(l+1)}`,lk:'Rompe 8 geodas'},
{k:'dyn',n:'Dinamita',ic:'💥',b:2500,g:2.2,u:()=>S.geo>=12,d:l=>l?`Explosión más potente (nv ${l}→${l+1})`:'Desbloquea un botón de explosión (Espacio)',lk:'Rompe 12 geodas'}];
const cost=u=>Math.ceil(u.b*u.g**S.up[u.k]);
const GL=[['Rompe tu primera geoda',()=>S.geo,1,25],['Compra tu primera mejora',()=>S.bought,1,40],['Rompe 5 geodas',()=>S.geo,5,150],['Reúne 2.000 gemas en total',()=>S.tot,2000,400],['Llega a la Mina de amatista (8 geodas)',()=>S.geo,8,700],['Compra 12 mejoras',()=>S.bought,12,2500],['Alcanza la Gruta esmeralda (16 geodas)',()=>S.geo,16,9000],['Reúne 1M de gemas en total',()=>S.tot,1e6,90000],['Alcanza la Cámara de rubí (24 geodas)',()=>S.geo,24,5e5],['Llega al Corazón cósmico (32 geodas)',()=>S.geo,32,5e6]];
/* ---------- estado de partida ---------- */
let combo=0,comboT=0,drillAcc=0,shake=0,last=0,paused=false,disp=S.g,dynCD=0,t0=0,ws={a:Math.random()*6.28,s:1.1},geo=null,GP={x:0,y:0,r:90};
const P=[],FT=[],motes=Array.from({length:40},()=>({x:Math.random(),y:Math.random(),s:Math.random()*.03+.01,z:Math.random()*2+.5}));
const pw=()=>(1+S.up.pick)*(1+Math.min(combo,30)*.03*S.up.combo);
const gpd=()=>2**S.up.mult*(1+.1*S.geo);
const dps=()=>S.up.drill*2;
const wsMult=()=>3+S.up.crit*.5;
const wsR=()=>GP.r*.13+S.up.crit*2;
function newGeo(){const n=S.geo,m=Math.round(10*1.22**n);geo={hp:m,max:m,seed:Array.from({length:16},()=>Math.random()),sq:0,sp:0,ph:Math.random()*6}}
newGeo();
/* ---------- efectos ---------- */
function ft(x,y,t,c,sc=1){if(FT.length<40)FT.push({x:x+Math.random()*30-15,y,t,c,sc,l:0})}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}
/* ---------- lógica ---------- */
function hit(d,x,y,crit,auto){
 if(!geo||geo.sp<.7)return;
 const gain=d*gpd();geo.hp-=d;S.g+=gain;S.tot+=gain;
 if(!auto){geo.sq=1;if(!RM)shake=Math.max(shake,crit?7:2)}
 ft(x,y,'+'+fmt(gain),crit?'#ffd25e':'#bff',auto?.8:crit?1.5:1);
 burst(x,y,crit?16:auto?2:5,crit?48:ZH[zi()],crit?1.3:1);
 if(!auto)snd(crit?880:260+Math.random()*120,crit?.18:.07,crit?'sine':'triangle',crit?.25:.18,crit?200:-120);
 if(geo.hp<=0)breakGeo()}
function breakGeo(){
 const bonus=geo.max*gpd()*.5;S.g+=bonus;S.tot+=bonus;const z0=zi();S.geo++;
 ft(GP.x,GP.y-GP.r*.3,'ROTA +'+fmt(bonus),'#ffd25e',2);burst(GP.x,GP.y,60,ZH[z0],1.6);
 if(!RM)shake=14;snd(150,.35,'sawtooth',.25,-90);arp([523,659,784,1047]);
 if(zi()>z0){toast('Nueva zona: '+ZN[zi()]);arp([392,523,659,784,1047,1319],'triangle')}
 newGeo();save()}
function buy(k,el){
 const u=U.find(x=>x.k===k);if(!u||!u.u())return;const c=cost(u);
 if(S.g<c){snd(120,.12,'square',.1);return}
 S.g-=c;S.up[k]++;S.bought++;arp([520,660,880]);burst(GP.x,GP.y,18,150,.9);
 el.classList.add('pop');setTimeout(()=>el.classList.remove('pop'),130);
 if(k==='dyn'&&S.up.dyn===1)toast('Dinamita lista: pulsa el botón o Espacio');save()}
function boom(){
 if(!S.up.dyn||dynCD>0||!geo||geo.sp<.7)return;dynCD=15;
 hit(pw()*20*(1+S.up.dyn*.5),GP.x,GP.y,true);if(!RM)shake=Math.max(shake,18);burst(GP.x,GP.y,40,30,2);snd(90,.4,'sawtooth',.3,-50)}
function tap(px,py){
 if(!geo)return;const dx=px-GP.x,dy=py-GP.y;
 if(Math.hypot(dx,dy)>GP.r*1.15){return}
 const wx=GP.x+Math.cos(ws.a)*GP.r*.55,wy=GP.y+Math.sin(ws.a)*GP.r*.5,isW=S.tot>=10&&Math.hypot(px-wx,py-wy)<wsR()+8;
 combo++;comboT=1.1;
 if(isW){hit(pw()*wsMult(),px,py,true);ws.a=Math.random()*6.28;ws.s=(Math.random()<.5?-1:1)*(1.1+Math.random())}
 else hit(pw(),px,py,false)}
/* ---------- render ---------- */
function ease(t){return 1-(1-t)**3}
/* ===== RENDER 2.0: materiales, luz y partículas (sustituye al render anterior) ===== */
const ZM=[{rk:[118,122,132],h:205,s:26,l:78,gl:'#a8d4ff'},{rk:[100,86,116],h:275,s:62,l:46,gl:'#c48bff'},{rk:[78,98,88],h:148,s:68,l:40,gl:'#5dffa0'},{rk:[116,80,82],h:352,s:78,l:36,gl:'#ff5a6e'},{rk:[72,74,104],h:255,s:60,l:32,gl:'#7fb6ff'}];
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const TX=[],PT=[],BG={},GF=[];let flash=0,kx=0,ky=0,zPrev=0,zCur=-1,zFade=0,lastT=0;
function tex(z){if(TX[z])return TX[z];const n=256,c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d'),im=x.createImageData(n,n),r=rng(z*77+3),oc=[],b=ZM[z].rk;
 for(let o=0;o<4;o++){const g=6<<o,a=new Float32Array(g*g);for(let i=0;i<a.length;i++)a[i]=r();oc.push([g,a])}
 const nv=(px,py)=>{let s=0,w=.5,T=0;for(const[g,a]of oc){const fx=px/n*g,fy=py/n*g,ix=fx|0,iy=fy|0,tx=fx-ix,ty=fy-iy,sx=tx*tx*(3-2*tx),sy=ty*ty*(3-2*ty),i0=iy%g*g,i1=(iy+1)%g*g,u=a[i0+ix%g]+(a[i0+(ix+1)%g]-a[i0+ix%g])*sx,d=a[i1+ix%g]+(a[i1+(ix+1)%g]-a[i1+ix%g])*sx;s+=w*(u+(d-u)*sy);T+=w;w*=.55}return s/T};
 for(let py=0;py<n;py++)for(let px=0;px<n;px++){const v=nv(px,py),vn=Math.abs(Math.sin(px/n*12.566+v*10))<.05?.35:0,k=.3+v+(r()-.5)*.22+vn,sp=r()<.004?70:0,i=(py*n+px)*4;im.data[i]=Math.min(255,b[0]*k+sp);im.data[i+1]=Math.min(255,b[1]*k+sp);im.data[i+2]=Math.min(255,b[2]*k+sp);im.data[i+3]=255}
 x.putImageData(im,0,0);return TX[z]=c}
function crys(c,len,w,hu,sa,li,ang,ph,a,T,z){
 const LA=-2.4,x1=len*.78,F=.8,E=[-w,-w*.33,w*.33,w],nr=[ang-1.1,ang,ang+1.1];
 for(let i=0;i<3;i++){const sh=z===4?(i-1)*38+Math.sin(T*.8+ph)*22:0,l=Math.max(6,Math.min(90,li+Math.cos(nr[i]-LA)*20-3)),H=hu+sh,g=c.createLinearGradient(0,0,len,0);
  g.addColorStop(0,`hsla(${H},${sa}%,${l*.45}%,${a*.8})`);g.addColorStop(1,`hsla(${H},${sa}%,${Math.min(95,l+8)}%,${a*.92})`);c.fillStyle=g;
  c.beginPath();c.moveTo(0,E[i]);c.lineTo(x1,E[i]*F);c.lineTo(x1,E[i+1]*F);c.lineTo(0,E[i+1]);c.fill();
  c.fillStyle=`hsla(${H},${sa}%,${Math.min(96,l+10)}%,${a*.95})`;c.beginPath();c.moveTo(x1,E[i]*F);c.lineTo(len,0);c.lineTo(x1,E[i+1]*F);c.fill()}
 c.strokeStyle=`hsla(${hu},${sa}%,8%,${.5*a})`;c.lineWidth=.8;c.beginPath();c.moveTo(0,-w);c.lineTo(x1,-w*F);c.lineTo(len,0);c.lineTo(x1,w*F);c.lineTo(0,w);c.stroke();
 c.strokeStyle=`rgba(255,255,255,${.5*a})`;c.lineWidth=1.1;c.beginPath();c.moveTo(len*.08,-w*.93);c.lineTo(x1*.96,-w*.76);c.stroke();
 c.strokeStyle=`hsla(${hu},${sa}%,${Math.min(95,li+22)}%,${.22*a})`;c.lineWidth=w*.5;c.beginPath();c.moveTo(len*.1,0);c.lineTo(len*.8,0);c.stroke();
 if(Math.sin(T*2.2+ph*30)>.94){c.strokeStyle='#fff';c.lineWidth=1.2;c.beginPath();c.moveTo(len-6,0);c.lineTo(len+6,0);c.moveTo(len,-6);c.lineTo(len,6);c.stroke()}}
function bgImg(z){const sz=(W|0)+'x'+(H|0);if(BG.sz!==sz){for(const q in BG)delete BG[q];BG.sz=sz}if(BG[z])return BG[z];
 const w=Math.max(2,W|0),h=Math.max(2,H|0),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),m=ZM[z],r=rng(z*31+9);
 let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#050409');g.addColorStop(1,`hsl(${m.h},38%,8%)`);x.fillStyle=g;x.fillRect(0,0,w,h);
 x.globalAlpha=.3;x.fillStyle=x.createPattern(tex(z),'repeat');x.fillRect(0,0,w,h);x.globalAlpha=1;
 for(let L=0;L<3;L++){x.fillStyle=`rgba(3,2,7,${.4+L*.22})`;for(const d of[0,1]){const y0=d?h:0,sg=d?-1:1;x.beginPath();x.moveTo(0,y0);for(let i=0;i<=12;i++)x.lineTo(i/12*w,y0+sg*h*(.05+L*.05)*(.3+r()*1.6)*(i%2?1:.55));x.lineTo(w,y0);x.fill()}}
 for(let i=0;i<14;i++){const sd=r()<.5,px=sd?r()*w*.2:w-r()*w*.2,py=h*(.15+r()*.7),s=8+r()*18;for(let j=0;j<3;j++){x.save();x.translate(px,py);x.rotate((sd?0:Math.PI)+(r()-.5)*1.4);crys(x,s*(.7+r()*.6),s*.14,z===4?200+r()*80:m.h,m.s,m.l*.7,0,r(),.5,0,z);x.restore()}}
 g=x.createRadialGradient(w/2,h/2,0,w/2,h/2,Math.max(w,h)*.6);g.addColorStop(0,`hsla(${m.h},50%,38%,.2)`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,w,h);
